# Temporary HTTP-only server for @@DOMAIN@@ and @@BETA_DOMAIN@@, used
# ONLY to obtain the initial Let's Encrypt certificate via
# `certbot --webroot`. install.sh installs this, runs certbot, then
# replaces it with the full config (bookstride.nettek.ca.conf). Keep it
# minimal so there is nothing for certbot to conflict with.
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@ @@BETA_DOMAIN@@;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 200 "bookstride pending TLS setup; run install.sh to finish.\n";
    }
}
