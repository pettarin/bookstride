# bookstride.nettek.ca — TLS-terminating reverse proxy for the
# Bookstride server (Rocket, listening on 127.0.0.1:8000).
#
#   https://bookstride.nettek.ca/       ->  http://127.0.0.1:8000
#   https://bookstride-beta.nettek.ca/  ->  http://127.0.0.1:8000
#   http (both)                         ->  301 to https
#
# Both hostnames are served by the same backend and covered by a single
# Let's Encrypt certificate. Installed by deploy/install.sh to
# /etc/nginx/conf.d/ (Fedora's nginx.conf includes conf.d/*.conf). Until
# the certificate exists, only the http-only variant
# (bookstride.nettek.ca.http-only.conf) is installed so certbot can
# validate.
#
# @@DOMAIN@@ and @@BETA_DOMAIN@@ are substituted by install.sh.

# --- HTTP: ACME webroot challenge + redirect to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name @@DOMAIN@@ @@BETA_DOMAIN@@;

    # Let's Encrypt webroot validation (certbot --webroot -w /var/www/html).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # $host preserves whichever name was requested, so each redirects to
    # its own https:// origin.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: the service ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @@DOMAIN@@ @@BETA_DOMAIN@@;

    # One certificate (the '@@CERT_NAME@@' lineage) covers both names.
    # The fixed certbot --cert-name keeps this path stable no matter
    # which names are currently in the cert, so you can issue for beta
    # first and add the apex later without editing nginx.
    ssl_certificate     /etc/letsencrypt/live/@@CERT_NAME@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@CERT_NAME@@/privkey.pem;

    # Modern TLS, self-contained (no dependency on certbot-generated
    # include files that may not exist with `certbot certonly`).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bookstride_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Inbound requests are tiny (a login form); cap the body modestly.
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /v0/book/<isbn>/download can block while the app retries
        # libro.fm with backoff, and track.mp3 responses are multi-MB
        # audio. Give responses room, and stream them straight through
        # rather than buffering large bodies to disk.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
