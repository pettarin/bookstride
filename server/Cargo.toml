[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
rocket = {version = "0.5.1", features = ["json"]}
reqwest = {version = "0.12.12", features = ["json"]}
rocket_db_pools = {version = "0.2.0", features = ["sqlx_sqlite"]}
sqlx = {version = "*", features = ["migrate"]}
rand = "0.9.0"
zip = "2.2.2"
governor = "0.10"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
