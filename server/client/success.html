<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <!--
      GoatCounter pageview on /success. count.js always sends location.search
      in its own `q` field — which on this page carries ?token=..., so we
      suppress it. Approach:

       1. Set no_onload so count.js doesn't auto-fire a hit during load.
       2. On script load, wrap get_data to delete the `q` field.
       3. Then manually call count() for the pageview.

      This matches the pattern hacklily uses in analytics.ts.
    -->
    <script>
      window.goatcounter = { no_onload: true, path: "/success" };
    </script>
    <script
      data-goatcounter="https://bookstride.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>
    <script>
      var s = document.querySelector(
        'script[data-goatcounter="https://bookstride.goatcounter.com/count"]'
      );
      s.addEventListener("load", function () {
        var orig = window.goatcounter.get_data;
        if (orig) {
          window.goatcounter.get_data = function (vars) {
            var data = orig(vars);
            delete data.q;
            return data;
          };
        }
        window.goatcounter.count();
      });
    </script>
  </head>
  <body>
    <div class="w-96 mx-auto mt-4 p-2">
      <div
        class="text-md border-green-600 text-green-600 border-2 rounded-md mb-8 p-2 justify-center items-center flex"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6 inline-block"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m4.5 12.75 6 6 9-13.5"
          />
        </svg>
        Signed in. Please wait&hellip;
      </div>
      <div class="text-xs italic text-center">
        It is safe to close this window.
      </div>
    </div>
  </body>
</html>
